  <footer id="help">
    <p>Drag to pan · Scroll or pinch to zoom · Double-click to zoom in</p>
    <p>Keyboard: <kbd>← ↑ ↓ →</kbd> pan · <kbd>+ −</kbd> zoom · <kbd>F</kbd> fit · <kbd>0</kbd> actual size</p>
  </footer>
  <noscript>This viewer needs JavaScript enabled to zoom and pan.</noscript>
  <script>
    'use strict';
    const viewport = document.getElementById('viewport');
    const diagram = document.getElementById('diagram');
    const zoomLevel = document.getElementById('zoom-level');
    const zoomIn = document.getElementById('zoom-in');
    const zoomOut = document.getElementById('zoom-out');
    const diagramWidth = 4384;
    const diagramHeight = 3612;
    const minScale = .01;
    const maxScale = 4;
    let scale = 1;
    let x = 0;
    let y = 0;
    let fitted = true;
    const pointers = new Map();

    function draw() {
      diagram.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
      zoomLevel.value = `${Math.round(scale * 100)}%`;
      zoomIn.disabled = scale >= maxScale;
      zoomOut.disabled = scale <= minScale;
    }

    function fit() {
      scale = Math.max(minScale, Math.min(
        (viewport.clientWidth - 32) / diagramWidth,
        (viewport.clientHeight - 32) / diagramHeight,
        1
      ));
      x = (viewport.clientWidth - diagramWidth * scale) / 2;
      y = (viewport.clientHeight - diagramHeight * scale) / 2;
      fitted = true;
      draw();
    }

    function zoomAt(nextScale, anchorX, anchorY) {
      nextScale = Math.min(maxScale, Math.max(minScale, nextScale));
      const ratio = nextScale / scale;
      x = anchorX - (anchorX - x) * ratio;
      y = anchorY - (anchorY - y) * ratio;
      scale = nextScale;
      fitted = false;
      draw();
    }

    function zoomCenter(nextScale) {
      zoomAt(nextScale, viewport.clientWidth / 2, viewport.clientHeight / 2);
    }

    function localPoint(event) {
      const bounds = viewport.getBoundingClientRect();
      return { x: event.clientX - bounds.left, y: event.clientY - bounds.top };
    }

    function gesture() {
      const points = [...pointers.values()];
      if (points.length < 2) return { ...points[0], distance: 0 };
      return {
        x: (points[0].x + points[1].x) / 2,
        y: (points[0].y + points[1].y) / 2,
        distance: Math.hypot(points[1].x - points[0].x, points[1].y - points[0].y)
      };
    }

    zoomIn.addEventListener('click', () => zoomCenter(scale * 1.4));
    zoomOut.addEventListener('click', () => zoomCenter(scale / 1.4));
    document.getElementById('fit').addEventListener('click', fit);
    document.getElementById('actual-size').addEventListener('click', () => zoomCenter(1));

    viewport.addEventListener('wheel', event => {
      event.preventDefault();
      const point = localPoint(event);
      const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? viewport.clientHeight : 1;
      const delta = Math.max(-100, Math.min(100, event.deltaY * unit));
      zoomAt(scale * Math.exp(-delta * .003), point.x, point.y);
    }, { passive: false });

    viewport.addEventListener('dblclick', event => {
      const point = localPoint(event);
      zoomAt(scale * (event.shiftKey ? .5 : 2), point.x, point.y);
    });

    viewport.addEventListener('pointerdown', event => {
      if (event.button !== 0) return;
      viewport.focus({ preventScroll: true });
      viewport.setPointerCapture(event.pointerId);
      pointers.set(event.pointerId, localPoint(event));
      viewport.classList.add('dragging');
    });

    viewport.addEventListener('pointermove', event => {
      if (!pointers.has(event.pointerId)) return;
      const before = gesture();
      pointers.set(event.pointerId, localPoint(event));
      const after = gesture();
      if (before.distance > 0 && after.distance > 0) {
        zoomAt(scale * after.distance / before.distance, before.x, before.y);
      }
      x += after.x - before.x;
      y += after.y - before.y;
      fitted = false;
      draw();
    });

    function endPointer(event) {
      pointers.delete(event.pointerId);
      if (pointers.size === 0) viewport.classList.remove('dragging');
    }
    viewport.addEventListener('pointerup', endPointer);
    viewport.addEventListener('pointercancel', endPointer);
    viewport.addEventListener('lostpointercapture', endPointer);

    document.addEventListener('keydown', event => {
      if (event.ctrlKey || event.metaKey || event.altKey) return;
      if (event.target.closest('button') && ['Enter', ' '].includes(event.key)) return;
      switch (event.key) {
        case '+': case '=': zoomCenter(scale * 1.4); break;
        case '-': case '_': zoomCenter(scale / 1.4); break;
        case '0': zoomCenter(1); break;
        case 'f': case 'F': fit(); break;
        case 'ArrowLeft': x += 60; fitted = false; draw(); break;
        case 'ArrowRight': x -= 60; fitted = false; draw(); break;
        case 'ArrowUp': y += 60; fitted = false; draw(); break;
        case 'ArrowDown': y -= 60; fitted = false; draw(); break;
        default: return;
      }
      event.preventDefault();
    });

    let previousWidth = viewport.clientWidth;
    let previousHeight = viewport.clientHeight;
    new ResizeObserver(() => {
      if (fitted) fit();
      else {
        x += (viewport.clientWidth - previousWidth) / 2;
        y += (viewport.clientHeight - previousHeight) / 2;
        draw();
      }
      previousWidth = viewport.clientWidth;
      previousHeight = viewport.clientHeight;
    }).observe(viewport);
    fit();
  </script>
