<!doctype html>
<!-- Generated by scripts/build-viewer.py. Edit scripts/viewer-template.html. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Homelab Diagram</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f8f9f5, #1a2422);
      --board: light-dark(#fbfcf8, #1a2422);
      --surface: light-dark(#fff, #22302d);
      --fg: light-dark(#202a28, #f1f0e5);
      --muted: light-dark(#53615d, #bcc9c1);
      --line: light-dark(#d7ded7, #485952);
      --blue: light-dark(#2058a6, #a8cff5);
      --sticky: light-dark(#fff1a6, #e8d98f);
      font-family: Inter, system-ui, sans-serif;
      color: var(--fg);
      background: var(--bg);
    }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100dvh; display: flex; flex-direction: column; }
    header {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 12px 24px; padding: 14px 20px; border-bottom: 2px solid var(--line);
    }
    h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.02em; color: var(--blue); }
    .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .controls { display: flex; align-items: center; gap: 6px; }
    button {
      min-width: 40px; min-height: 40px; padding: 8px 12px;
      color: var(--fg); background: var(--surface); border: 1.5px solid var(--line);
      border-radius: 7px 5px 8px 4px / 5px 8px 4px 7px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:hover { border-color: var(--blue); color: var(--blue); }
    button:disabled { opacity: .45; cursor: default; }
    button:focus-visible, #viewport:focus-visible { outline: 2px solid var(--blue); outline-offset: -3px; }
    #fit { color: #202a28; background: var(--sticky); border-color: color-mix(in srgb, var(--sticky) 70%, #202a28); box-shadow: 1px 2px 0 #0002; }
    #fit:hover { transform: rotate(-1deg); }
    #zoom-level { min-width: 55px; text-align: center; font: 600 13px ui-monospace, monospace; color: var(--muted); }
    #viewport {
      position: relative; flex: 1; min-height: 160px; overflow: hidden;
      background: var(--board); touch-action: none; cursor: grab; user-select: none;
    }
    #viewport.dragging { cursor: grabbing; }
    #diagram {
      position: absolute; left: 0; top: 0; max-width: none;
      transform-origin: 0 0; pointer-events: none; user-select: none;
    }
    footer {
      display: flex; flex-wrap: wrap; justify-content: space-between;
      gap: 6px 20px; padding: 10px 20px; color: var(--muted);
      border-top: 2px solid var(--line); font-size: 12px; line-height: 1.5;
    }
    footer p { margin: 0; }
    kbd { font: 12px ui-monospace, monospace; color: var(--fg); }
    @media (max-width: 520px) {
      header { padding: 12px; gap: 12px; }
      .controls { width: 100%; justify-content: space-between; }
      .controls button { padding: 8px 9px; font-size: 13px; }
      #zoom-level { min-width: 43px; }
      footer { padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>My Homelab Diagram</h1>
      <p class="subtitle">Talos · Proxmox · Tiered storage · UniFi VLANs</p>
    </div>
    <nav class="controls" aria-label="Diagram controls">
      <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out (−)">−</button>
      <output id="zoom-level" aria-label="Zoom level">100%</output>
      <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in (+)">+</button>
      <button id="actual-size" type="button" title="Actual size (0)">100%</button>
      <button id="fit" type="button" title="Fit diagram (F)">Fit diagram</button>
    </nav>
  </header>
  <main id="viewport" tabindex="0" aria-label="Homelab diagram. Drag to pan, scroll or pinch to zoom. Use arrow keys to pan, plus or minus to zoom, F to fit, and 0 for actual size." aria-describedby="help">
    <img id="diagram" src="__DIAGRAM_LIGHT_URL__" width="__DIAGRAM_WIDTH__" height="__DIAGRAM_HEIGHT__" draggable="false" alt="Homelab topology showing the UniFi network, Talos cluster, standalone Proxmox nodes, NAS storage, standalone infrastructure, and spare hardware.">
  </main>
  <footer id="help">
    <p>Drag to pan · Scroll or pinch to zoom · Double-click to zoom in · <strong>Fit diagram</strong> shows it all</p>
    <p>Keyboard: <kbd>← ↑ ↓ →</kbd> pan · <kbd>+ −</kbd> zoom · <kbd>F</kbd> fit · <kbd>0</kbd> actual size</p>
  </footer>
  <noscript>This viewer needs JavaScript enabled to zoom and pan.</noscript>
  <script>
    'use strict';
    const viewport = document.getElementById('viewport');
    const diagram = document.getElementById('diagram');
    const zoomLevel = document.getElementById('zoom-level');
    const zoomIn = document.getElementById('zoom-in');
    const zoomOut = document.getElementById('zoom-out');
    const sources = { light: diagram.getAttribute('src'), dark: '__DIAGRAM_DARK_URL__' };
    const darkQuery = matchMedia('(prefers-color-scheme: dark)');
    // Follow ?theme=, then the embedding site's theme toggle, then the OS setting.
    function hostTheme() {
      try { return parent !== window ? parent.document.documentElement.dataset.theme : undefined; } catch { return undefined; }
    }
    function applyTheme() {
      const requested = new URLSearchParams(location.search).get('theme') || hostTheme();
      const theme = requested === 'light' || requested === 'dark' ? requested : darkQuery.matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
      if (diagram.getAttribute('src') !== sources[theme]) diagram.src = sources[theme];
    }
    applyTheme();
    darkQuery.addEventListener('change', applyTheme);
    try {
      if (parent !== window) new MutationObserver(applyTheme).observe(parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    } catch {}
    const diagramWidth = __DIAGRAM_WIDTH__;
    const diagramHeight = __DIAGRAM_HEIGHT__;
    const minScale = .01;
    const maxScale = 4;
    let scale = 1;
    let x = 0;
    let y = 0;
    let fitted = true;
    const pointers = new Map();

    function draw() {
      diagram.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
      zoomLevel.value = `${Math.round(scale * 100)}%`;
      zoomIn.disabled = scale >= maxScale;
      zoomOut.disabled = scale <= minScale;
    }

    function fit() {
      scale = Math.max(minScale, Math.min(
        (viewport.clientWidth - 32) / diagramWidth,
        (viewport.clientHeight - 32) / diagramHeight,
        1
      ));
      x = (viewport.clientWidth - diagramWidth * scale) / 2;
      y = (viewport.clientHeight - diagramHeight * scale) / 2;
      fitted = true;
      draw();
    }

    function zoomAt(nextScale, anchorX, anchorY) {
      nextScale = Math.min(maxScale, Math.max(minScale, nextScale));
      const ratio = nextScale / scale;
      x = anchorX - (anchorX - x) * ratio;
      y = anchorY - (anchorY - y) * ratio;
      scale = nextScale;
      fitted = false;
      draw();
    }

    function zoomCenter(nextScale) {
      zoomAt(nextScale, viewport.clientWidth / 2, viewport.clientHeight / 2);
    }

    function localPoint(event) {
      const bounds = viewport.getBoundingClientRect();
      return { x: event.clientX - bounds.left, y: event.clientY - bounds.top };
    }

    function gesture() {
      const points = [...pointers.values()];
      if (points.length < 2) return { ...points[0], distance: 0 };
      return {
        x: (points[0].x + points[1].x) / 2,
        y: (points[0].y + points[1].y) / 2,
        distance: Math.hypot(points[1].x - points[0].x, points[1].y - points[0].y)
      };
    }

    zoomIn.addEventListener('click', () => zoomCenter(scale * 1.4));
    zoomOut.addEventListener('click', () => zoomCenter(scale / 1.4));
    document.getElementById('fit').addEventListener('click', fit);
    document.getElementById('actual-size').addEventListener('click', () => zoomCenter(1));

    viewport.addEventListener('wheel', event => {
      event.preventDefault();
      const point = localPoint(event);
      const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? viewport.clientHeight : 1;
      const delta = Math.max(-100, Math.min(100, event.deltaY * unit));
      zoomAt(scale * Math.exp(-delta * .003), point.x, point.y);
    }, { passive: false });

    viewport.addEventListener('dblclick', event => {
      const point = localPoint(event);
      zoomAt(scale * (event.shiftKey ? .5 : 2), point.x, point.y);
    });

    viewport.addEventListener('pointerdown', event => {
      if (event.button !== 0) return;
      viewport.focus({ preventScroll: true });
      viewport.setPointerCapture(event.pointerId);
      pointers.set(event.pointerId, localPoint(event));
      viewport.classList.add('dragging');
    });

    viewport.addEventListener('pointermove', event => {
      if (!pointers.has(event.pointerId)) return;
      const before = gesture();
      pointers.set(event.pointerId, localPoint(event));
      const after = gesture();
      if (before.distance > 0 && after.distance > 0) {
        zoomAt(scale * after.distance / before.distance, before.x, before.y);
      }
      x += after.x - before.x;
      y += after.y - before.y;
      fitted = false;
      draw();
    });

    function endPointer(event) {
      pointers.delete(event.pointerId);
      if (pointers.size === 0) viewport.classList.remove('dragging');
    }
    viewport.addEventListener('pointerup', endPointer);
    viewport.addEventListener('pointercancel', endPointer);
    viewport.addEventListener('lostpointercapture', endPointer);

    document.addEventListener('keydown', event => {
      if (event.ctrlKey || event.metaKey || event.altKey) return;
      if (event.target.closest('button') && ['Enter', ' '].includes(event.key)) return;
      switch (event.key) {
        case '+': case '=': zoomCenter(scale * 1.4); break;
        case '-': case '_': zoomCenter(scale / 1.4); break;
        case '0': zoomCenter(1); break;
        case 'f': case 'F': fit(); break;
        case 'ArrowLeft': x += 60; fitted = false; draw(); break;
        case 'ArrowRight': x -= 60; fitted = false; draw(); break;
        case 'ArrowUp': y += 60; fitted = false; draw(); break;
        case 'ArrowDown': y -= 60; fitted = false; draw(); break;
        default: return;
      }
      event.preventDefault();
    });

    let previousWidth = viewport.clientWidth;
    let previousHeight = viewport.clientHeight;
    new ResizeObserver(() => {
      if (fitted) fit();
      else {
        x += (viewport.clientWidth - previousWidth) / 2;
        y += (viewport.clientHeight - previousHeight) / 2;
        draw();
      }
      previousWidth = viewport.clientWidth;
      previousHeight = viewport.clientHeight;
    }).observe(viewport);
    // On a phone the whole diagram fits only at ~15%, so open at a readable zoom at the top.
    function start() {
      if (viewport.clientWidth >= 600) return fit();
      scale = .6;
      x = (viewport.clientWidth - diagramWidth * scale) / 2;
      y = 12;
      fitted = false;
      draw();
    }
    start();
  </script>
</body>
</html>
