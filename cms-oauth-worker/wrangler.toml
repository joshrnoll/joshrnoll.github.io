# Cloudflare Worker that signs Decap CMS users in with GitHub.
# Deploy steps and secrets: see README.md in this folder.
name = "cms-oauth"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = true

[vars]
# Origins that may receive a GitHub token. Add http://localhost:4321 to test
# the CMS against a local `npm run dev`.
ALLOWED_ORIGINS = "https://joshrnoll.com"

# GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET are Worker secrets, set with
# `npx wrangler secret put`. Never put them in this file.
