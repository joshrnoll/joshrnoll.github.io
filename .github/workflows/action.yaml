# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploy Website to Azure Storage Account
on:
  workflow_dispatch:
  push:
    paths:
      - "astro/src/**"
      - "astro/public/**"
      - "astro/package.json"
      - "astro/package-lock.json"
      - "astro/astro.config.mjs"
      - "astro/tsconfig.json"
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install azcopy
        uses: kheiakiyama/install-azcopy-action@v1
        with:
          version: "v10"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
        working-directory: astro
      - name: Build site
        run: npm run build
        working-directory: astro
      - name: Sync files to Azure storage account
        run: azcopy_v10 sync "./astro/dist" "${{ secrets.endpoint_sas_url }}" --recursive --delete-destination=true --from-to LocalBlob
